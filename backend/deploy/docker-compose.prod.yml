name: storybook-prod

# Production stack for a single Ubuntu VPS:
#   caddy (public :80/:443, auto-HTTPS)  ->  api (:8000, internal)  ->  db (internal)
# Only Caddy is exposed to the internet; api + db stay on the compose network.
# All secrets come from ./.env (see .env.production.example). Required vars use
# ${VAR:?...} so compose refuses to start if any is missing.
#
# Services are targeted independently during a coordinated release (see
# README.md) — none of the patterns below require changes to this file:
#   docker compose stop caddy api                 # maintenance: DB keeps running
#   docker compose run --rm api alembic upgrade head
#   docker compose up -d api                      # backend only, Caddy stays down
#   docker compose run --rm api python privacy_reconcile.py
#   docker compose up -d caddy                    # traffic resumes last
# One-off `compose run` commands work because the image ENTRYPOINT execs any
# arguments it receives (backend/deploy/entrypoint.sh).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: storybook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: storybook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storybook -d storybook"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No `ports:` — Postgres is reachable only inside the compose network.

  api:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://storybook:${POSTGRES_PASSWORD:?}@db:5432/storybook
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ASSET_URL_SECRET: ${ASSET_URL_SECRET:?set ASSET_URL_SECRET in .env}
      ASSET_URL_TTL_SECONDS: ${ASSET_URL_TTL_SECONDS:-3600}
      STORAGE_DIR: storage
      # TTS proxy (POST /v1/tts). Compose forwards ONLY what is named here, so
      # putting the key in .env is not enough on its own — it must be listed.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-coral}
      OPENAI_TTS_TIMEOUT_SECONDS: ${OPENAI_TTS_TIMEOUT_SECONDS:-30}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      GOOGLE_VISION_TIMEOUT_SECONDS: ${GOOGLE_VISION_TIMEOUT_SECONDS:-15}
      SCAN_OCR_DEBUG_LOGGING: ${SCAN_OCR_DEBUG_LOGGING:-true}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?set ELEVENLABS_API_KEY in .env}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-5yEPTrA0uAhZsBEhHjfi}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3}
      ELEVENLABS_TTS_TIMEOUT_SECONDS: ${ELEVENLABS_TTS_TIMEOUT_SECONDS:-60}
    volumes:
      # Audio binaries live on the host so `register_assets.py` picks up files
      # you scp in later, and they survive image rebuilds. Maps to backend/storage.
      - ../storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    # No `ports:` — only Caddy reaches the API.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
